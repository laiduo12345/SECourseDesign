<svg xmlns="http://www.w3.org/2000/svg" width="940" height="926" viewBox="0 0 940 926" role="img" aria-labelledby="title desc">
  <title id="title">DevForum 业务用例与参与者</title>
  <desc id="desc">系统边界内按用户目标汇总业务用例。游客可注册、登录和浏览。成员、版主和管理员参与各自获准的操作；外部内容源和可选 AI 服务配合采集与辅助分析。</desc>
  <defs>
    <g id="actor" stroke="#405A73" stroke-width="1.6" fill="white">
      <circle cy="-15" r="7"/><path d="M0 -8V10 M-12 0H12 M0 10L-11 23 M0 10L11 23" fill="none"/>
    </g>
  </defs>
  <style>
    text { font: 16px 'Microsoft YaHei', 'Noto Sans SC', sans-serif; fill: #24364b; text-anchor: middle }
    text.ids { font-size: 13px; fill: #445b72 }
    ellipse { fill: #f3f6fa; stroke: #59718b }
    .link { fill: none; stroke: #52677d; stroke-width: 1.35 }
  </style>
  <rect width="940" height="926" fill="white"/>
  <rect x="205" y="12" width="529" height="895" rx="8" fill="white" stroke="#a5b4c5"/>
  <text x="470" y="40" style="font-size:21px;font-weight:bold">DevForum 平台</text>
  <g>
    <path class="link" d="M113 111 L297 80"/>
    <path class="link" d="M113 111 L297 145"/>
    <path class="link" d="M113 303 L297 210"/>
    <path class="link" d="M113 303 L297 275"/>
    <path class="link" d="M113 303 L297 340"/>
    <path class="link" d="M113 303 L297 405"/>
    <path class="link" d="M113 470 L297 470"/>
    <path class="link" d="M113 695 L297 535"/>
    <path class="link" d="M113 695 L297 600"/>
    <path class="link" d="M113 695 L297 665"/>
    <path class="link" d="M113 695 L297 730"/>
    <path class="link" d="M113 695 L297 795"/>
    <path class="link" d="M113 695 L297 860"/>
    <path class="link" d="M817 795 L643 795"/>
    <path class="link" d="M817 874 L643 860"/>
    <g transform="translate(470 80)">
      <ellipse rx="173" ry="28"/>
      <text y="-2">注册账号或登录</text><text class="ids" y="15">UC-01</text>
    </g>
    <g transform="translate(470 145)">
      <ellipse rx="173" ry="28"/>
      <text y="-2">浏览公开内容、精选与知识库</text><text class="ids" y="15">UC-07、UC-13、UC-15</text>
    </g>
    <g transform="translate(470 210)">
      <ellipse rx="173" ry="28"/>
      <text y="-2">退出会话、维护资料与订阅</text><text class="ids" y="15">UC-01、UC-02、UC-03</text>
    </g>
    <g transform="translate(470 275)">
      <ellipse rx="173" ry="28"/>
      <text y="-2">投稿、推荐原文、讨论与采纳答案</text><text class="ids" y="15">UC-04、UC-05、UC-06</text>
    </g>
    <g transform="translate(470 340)">
      <ellipse rx="173" ry="28"/>
      <text y="-2">评价内容、提名精选与建议新来源</text><text class="ids" y="15">UC-08、UC-11、UC-12</text>
    </g>
    <g transform="translate(470 405)">
      <ellipse rx="173" ry="28"/>
      <text y="-2">举报违规内容、查询进度与通知</text><text class="ids" y="15">UC-17、UC-20</text>
    </g>
    <g transform="translate(470 470)">
      <ellipse rx="173" ry="28"/>
      <text y="-2">处理本板块举报、维护板块内容</text><text class="ids" y="15">UC-17、UC-18</text>
    </g>
    <g transform="translate(470 535)">
      <ellipse rx="173" ry="28"/>
      <text y="-2">处置举报、调整账号权限与复核异常票</text><text class="ids" y="15">UC-17、UC-18、UC-19</text>
    </g>
    <g transform="translate(470 600)">
      <ellipse rx="173" ry="28"/>
      <text y="-2">裁定精选与复核降权</text><text class="ids" y="15">UC-12、UC-13</text>
    </g>
    <g transform="translate(470 665)">
      <ellipse rx="173" ry="28"/>
      <text y="-2">编排专题、维护勘误与编发周报</text><text class="ids" y="15">UC-14、UC-15、UC-16</text>
    </g>
    <g transform="translate(470 730)">
      <ellipse rx="173" ry="28"/>
      <text y="-2">核对审计记录与运营统计</text><text class="ids" y="15">UC-21</text>
    </g>
    <g transform="translate(470 795)">
      <ellipse rx="173" ry="28"/>
      <text y="-2">管理内容源、采集与审核候选</text><text class="ids" y="15">UC-08、UC-09、UC-10</text>
    </g>
    <g transform="translate(470 860)">
      <ellipse rx="173" ry="28"/>
      <text y="-2">复核 AI 辅助分析建议</text><text class="ids" y="15">UC-24</text>
    </g>
    <g transform="translate(88 111)">
      <use href="#actor"/><text y="42">游客</text>
    </g>
    <g transform="translate(88 303)">
      <use href="#actor"/><text y="42">注册成员</text><text class="ids" y="60">含作者、提问者</text>
    </g>
    <g transform="translate(88 470)">
      <use href="#actor"/><text y="42">版主</text>
    </g>
    <g transform="translate(88 695)">
      <use href="#actor"/><text y="42">管理员</text>
    </g>
    <g transform="translate(855 795)">
      <use href="#actor"/><text y="42">外部内容源</text>
    </g>
    <g transform="translate(855 874)">
      <use href="#actor"/><text y="42">可选 AI 服务</text>
    </g>
  </g>
